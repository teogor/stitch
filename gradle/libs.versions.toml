jetbrainsCompose = "1.11.1"

# Build configurations
agp = "9.2.1"
kotlin = "2.4.0"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"

# Dependencies
core-ktx = "1.19.0"
junit = "4.13.2"
junit-version = "1.3.0"
espresso-core = "3.7.0"
